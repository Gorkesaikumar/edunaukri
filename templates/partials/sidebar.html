{% load static %}
{# Mobile Navigation Sidebar (Bootstrap offcanvas) — shown on <= 1024px viewports #}
<div class="offcanvas offcanvas-end ed-offcanvas" tabindex="-1" id="edMobileNav" aria-labelledby="edMobileNavLabel">
    <div class="offcanvas-header ed-offcanvas__header">
        <a class="ed-brand d-flex align-items-center gap-2" href="{% url 'home' %}" id="edMobileNavLabel">
            <img class="ed-brand__logo" src="{% static 'img/screen.jpeg' %}" alt="{{ PLATFORM_NAME }} logo">
        </a>
        <button type="button" class="btn-close ed-offcanvas__close" data-bs-dismiss="offcanvas" aria-label="Close navigation menu"></button>
    </div>
    <div class="offcanvas-body ed-offcanvas__body d-flex flex-column">
        <nav class="ed-mobile-nav-links d-flex flex-column gap-1" aria-label="Mobile navigation">
            <a class="ed-mobile-nav-link{% if nav.active == 'home' %} active{% endif %}" href="{% url 'home' %}"{% if nav.active == 'home' %} aria-current="page"{% endif %}>
                <i class="bi bi-house-door" aria-hidden="true"></i> Home
            </a>
            <a class="ed-mobile-nav-link{% if nav.active == 'jobs' %} active{% endif %}" href="{% url 'marketplace_browse_jobs' %}"{% if nav.active == 'jobs' %} aria-current="page"{% endif %}>
                <i class="bi bi-briefcase" aria-hidden="true"></i> Jobs
            </a>
            <a class="ed-mobile-nav-link{% if nav.active == 'institutions' %} active{% endif %}" href="{% url 'institutions_browse' %}"{% if nav.active == 'institutions' %} aria-current="page"{% endif %}>
                <i class="bi bi-buildings" aria-hidden="true"></i> Institutions
            </a>
            <a class="ed-mobile-nav-link{% if nav.active == 'about' %} active{% endif %}" href="{% url 'about' %}"{% if nav.active == 'about' %} aria-current="page"{% endif %}>
                <i class="bi bi-info-circle" aria-hidden="true"></i> About
            </a>
            <a class="ed-mobile-nav-link" href="#">
                <i class="bi bi-envelope" aria-hidden="true"></i> Contact
            </a>
        </nav>

        <hr class="ed-offcanvas__divider my-4">

        {% if nav.is_authenticated %}
        <div class="ed-mobile-user mt-auto">
            <p class="ed-mobile-user__label">Account</p>
            {% include "partials/nav_user_menu.html" with mobile=True %}
        </div>
        {% else %}
        <div class="d-flex flex-column gap-2 mt-auto pt-3">
            <a href="{% url 'domain_selection' %}" class="ed-btn ed-btn--outline-primary w-100 text-center justify-content-center py-2">Sign In</a>
            <a href="{% url 'signup_domain_selection' %}" class="ed-btn ed-btn--primary w-100 text-center justify-content-center py-2">Get Started</a>
        </div>
        {% endif %}
    </div>
</div>
